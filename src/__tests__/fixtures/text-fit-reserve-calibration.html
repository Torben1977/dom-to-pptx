<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .slide {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
        font-family: Arial, sans-serif;
      }
      .case {
        position: absolute;
        left: 220px;
        width: 520px;
        padding: 20px 24px;
        overflow: hidden;
        white-space: nowrap;
        outline: 2px solid #94a3b8;
        background: #f8fafc;
        color: #0f172a;
        font-size: 52px;
        line-height: 58px;
        font-weight: 700;
      }
      .r00 {
        top: 90px;
        height: 98px;
      }
      .r01 {
        top: 220px;
        height: 98.59px;
      }
      .r02 {
        top: 350px;
        height: 99.18px;
      }
      .r03 {
        top: 480px;
        height: 99.79px;
      }
      .r04 {
        top: 610px;
        height: 100.42px;
      }
      .r05 {
        top: 740px;
        height: 101.05px;
      }
      .r06 {
        top: 870px;
        height: 101.7px;
      }
    </style>
  </head>
  <body>
    <section class="slide">
      <div class="case r00">R00</div>
      <div class="case r01">R01</div>
      <div class="case r02">R02</div>
      <div class="case r03">R03</div>
      <div class="case r04">R04</div>
      <div class="case r05">R05</div>
      <div class="case r06">R06</div>
    </section>
  </body>
</html>
